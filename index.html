<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лист персонажа</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="hero">
    <input id="name" class="hero-name" data-path="name" type="text" maxlength="80" placeholder="Имя персонажа" autocomplete="off" aria-label="Имя персонажа">
  </header>

  <section class="rollbar" aria-label="Настройки броска">
    <div class="stepper" role="group" aria-label="Преимущество и помеха">
      <button type="button" id="adv-down" title="Больше помехи" aria-label="Больше помехи">−</button>
      <span id="adv-label" class="stepper-label" aria-live="polite"></span>
      <button type="button" id="adv-up" title="Больше преимущества" aria-label="Больше преимущества">+</button>
    </div>
    <button type="button" class="chip toggle" data-setting="hidden" title="Скрытый бросок: видите только вы и мастер">🔒</button>
    <button type="button" class="chip toggle" data-setting="showOnMap" title="Показывать результат на карте">🗺</button>
    <button type="button" class="chip toggle" id="toggle-3d" data-setting="use3d" title="3D-кубики">🎲</button>
  </section>

  <output id="last-roll" class="last-roll" aria-live="polite" hidden></output>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="sheet">Персонаж</button>
    <button type="button" role="tab" data-tab="combat">Бой</button>
    <button type="button" role="tab" data-tab="log">Журнал <span id="log-badge" class="badge" hidden></span></button>
  </nav>

  <main>
    <section class="panel" data-panel="sheet" role="tabpanel">
      <div id="abilities" class="abilities"></div>
      <h2 class="section-title">Навыки</h2>
      <div id="skills" class="skills"></div>
    </section>

    <section class="panel" data-panel="combat" role="tabpanel" hidden>
      <div class="stats">
        <label class="stat">
          <span>КД</span>
          <input data-path="combat.ac" data-kind="int" type="number" min="0" max="99" inputmode="numeric">
        </label>
        <div class="stat">
          <span>Инициатива</span>
          <button type="button" class="roll-btn big" id="roll-initiative" data-out="initiative"></button>
        </div>
        <label class="stat">
          <span>Скорость</span>
          <input data-path="combat.speed" data-kind="int" type="number" min="0" max="999" step="5" inputmode="numeric">
        </label>
      </div>
      <label class="inline-field">Прочий бонус инициативы
        <input data-path="combat.initiativeMisc" data-kind="int" type="number" min="-20" max="20" inputmode="numeric">
      </label>

      <h2 class="section-title">Хиты</h2>
      <div class="pool">
        <div class="bar"><div class="bar-fill" data-out="hpFill"></div></div>
        <div class="pool-fields">
          <label>Текущие<input data-path="hp.current" data-kind="int" type="number" min="0" inputmode="numeric"></label>
          <label>Максимум<input data-path="hp.max" data-kind="int" type="number" min="1" inputmode="numeric"></label>
        </div>
        <div class="pool-actions">
          <input id="hp-amount" type="number" min="0" inputmode="numeric" placeholder="0" aria-label="Количество хитов">
          <button type="button" class="btn danger" id="hp-damage">Урон</button>
          <button type="button" class="btn success" id="hp-heal">Лечение</button>
        </div>
      </div>

      <div id="resources" class="resources"></div>
      <button type="button" class="btn ghost wide" id="add-resource">+ Добавить ресурс (мана, дзен…)</button>

      <h2 class="section-title">Атаки и заклинания</h2>
      <div id="attacks" class="attacks"></div>
      <button type="button" class="btn ghost wide" id="add-attack">+ Добавить атаку</button>

      <h2 class="section-title">Свой бросок</h2>
      <form id="free-roll" class="free-roll">
        <input id="free-formula" type="text" placeholder="например, 2d6+3 или 4к6" autocomplete="off" aria-label="Формула броска">
        <button type="submit" class="btn primary">Бросить</button>
      </form>
      <div class="quick-dice" id="quick-dice"></div>
      <label class="inline-field" id="dice-style-field" hidden>Стиль 3D-кубиков
        <select id="dice-style" aria-label="Стиль 3D-кубиков"></select>
      </label>

      <h2 class="section-title">Заметки</h2>
      <textarea data-path="notes" maxlength="4000" rows="5" placeholder="Снаряжение, особенности, всё что угодно…"></textarea>
    </section>

    <section class="panel" data-panel="log" role="tabpanel" hidden>
      <ol id="log" class="log"></ol>
      <p id="log-empty" class="muted center">Здесь появятся броски всех игроков комнаты.</p>
      <button type="button" class="btn ghost wide" id="clear-log">Очистить журнал</button>
    </section>
  </main>

  <footer class="footer">
    <span id="status" class="muted"></span>
    <span class="footer-actions">
      <button type="button" class="link" id="open-backup">Резервная копия</button>
    </span>
  </footer>

  <dialog id="backup" class="dialog">
    <form method="dialog">
      <div class="dialog-head">
        <h2>Резервная копия листа</h2>
        <button class="close" value="close" aria-label="Закрыть">×</button>
      </div>
      <p class="muted">Скопируйте текст, чтобы сохранить персонажа, или вставьте сохранённый текст и нажмите «Загрузить».</p>
      <textarea id="backup-text" rows="10" spellcheck="false"></textarea>
      <p id="backup-error" class="error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn danger" id="reset-sheet">Очистить лист</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="download-backup">Скачать</button>
        <button type="button" class="btn primary" id="import-backup">Загрузить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
